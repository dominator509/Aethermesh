# AetherMesh Release Workflow — tag-triggered publish
# EP-009 M4. Per RELEASE.md.

name: Release

on:
  push:
    tags: ["v*"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: uv sync --all-extras --dev --frozen
      - run: ./scripts/verify.sh

  build-publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: uv sync --no-dev --frozen
      - run: uv build
      - name: Publish to PyPI
        run: uv publish --trusted-publishing always

  docker-images:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.mix-node
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/aethermesh-mix-node:${{ github.ref_name }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.gateway
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/aethermesh-gateway:${{ github.ref_name }}
